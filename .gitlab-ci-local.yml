stages:
  - build

variables:
  DOCKER_IMAGE: "tetris-project:latest"

build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  tags:
    - dosi-Latitude-5520
  script:
    - docker build -t $DOCKER_IMAGE .
    - docker run --entrypoint ant tetris-project all
  artifacts:
    paths:
      - bin/Tetris.jar