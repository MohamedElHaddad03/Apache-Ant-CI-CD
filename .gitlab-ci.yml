stages:
  - build

build:
  stage: build
  script:
    - docker build -t tetris-project:latest .
    - docker run --name tetris_container tetris-project:latest ant all
    - docker cp tetris_container:/app/bin/Tetris.jar .
    - docker rm tetris_container  
    - ls .  
  artifacts:
    paths:
      - Tetris.jar
  tags:
    - dosi
