name: CI

on:
  push:
    branches:
      - main
    tags:
      - '*.*.*'  
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build project
        run: |
          echo "Building project..."

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: my-artifact
          path: /app/bin/Tetris.jar

  deploy:
    runs-on: ubuntu-22.04
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && github.ref != '' && github.ref != 'refs/tags/'
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push to Docker Hub
        run: |
          echo "Tag name from GITHUB_REF_NAME: $GITHUB_REF_NAME"
          TAG=$$GITHUB_REF_NAME
          echo "Pushing Tetris project to Docker Hub with tag: $TAG"
          docker build -t tetris-project:$TAG .
          docker push tetris-project:$TAG
          
