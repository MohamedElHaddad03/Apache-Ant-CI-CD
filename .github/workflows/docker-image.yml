name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'  

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build project
        run: |
          echo "Building project..."

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: my-artifact
          path: ./nin/Tetris.jar


deploy:
  stage: deploy
  needs: 
    - build
  variables:
    DOCKER_USERNAME: 
    DOCKER_PASSWORD: 
  script:
    - |
      echo "Déploiement vers Docker Hub"
      docker login -u "$DOCKER_USERNAME" -p "$DOCKER_PASSWORD"
      docker tag tetris-project:latest $DOCKER_USERNAME/tetris-project:$CI_COMMIT_TAG
      docker push $DOCKER_USERNAME/tetris-project:$CI_COMMIT_TAG
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
      when: manual  
    - if: '$CI_COMMIT_TAG != "$(git describe --tags --abbrev=0)"'
      when: always
  tags:
    - dosi